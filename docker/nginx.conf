server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # ---- Gzip Compression ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/wasm application/octet-stream;

    # ---- Endpoint Khusus Healthcheck ----
    location = /health {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "healthy\n";
    }

    # ---- Main SPA Routing (Flutter Web) ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Static Assets Caching ----
    location ~* \.(?:ico|css|js|gif|jpe?g|png|wasm|woff2?)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # ---- Deny access to hidden files ----
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
